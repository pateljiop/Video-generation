name: Generate TechMind Video

on:
  schedule:
    - cron: '30 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-techmind-video.yml'
      - 'scripts/generate_techmind.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg + Blender
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg blender libegl1 libgl1 xvfb
          ffmpeg -version | head -n 1
          blender --version | head -n 1

      - name: Generate cinematic TechMind Short
        run: |
          set -e
          xvfb-run -a blender -b --python scripts/render_cinematic.py
          python -m pip install --quiet edge-tts
          edge-tts --voice hi-IN-MadhurNeural --rate +8% --text "AI agents ab sirf chat nahi karte. Ye computer par apps khol sakte hain, web browse kar sakte hain, code likh sakte hain, aur task complete hone tak khud verify bhi kar sakte hain. TechMind — AI jo aapke computer ke saath kaam karta hai." --write-media build/voice.mp3
          ffmpeg -y -i build/techmind-cinematic.mp4 -i build/voice.mp3 -c:v copy -c:a aac -b:a 128k -shortest build/techmind-daily.mp4

      - name: Validate output
        run: |
          set -e
          test -s build/techmind-daily.mp4
          ffprobe -v error -select_streams v:0             -show_entries stream=width,height,r_frame_rate             -of default=noprint_wrappers=1 build/techmind-daily.mp4
          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1 build/techmind-daily.mp4

      - name: Save MP4
        uses: actions/upload-artifact@v4
        with:
          name: techmind-daily-video
          path: build/techmind-daily.mp4
          if-no-files-found: error
          retention-days: 30
