name: Generate TechMind Video

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-techmind-video.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video topic/prompt"
        required: true
        default: "AI Agents अब सिर्फ Chat नहीं करते — आपका Computer भी चला सकते हैं"
      filename:
        description: "Output MP4 filename"
        required: true
        default: "techmind-ai-agents-computer.mp4"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify OpenRouter video models
        env:
          RENDER_URL: https://pixelle-video-31d7.onrender.com
        run: |
          set -e
          echo "Checking OpenRouter video model capabilities..."
          response=$(curl -fsS --retry 3 --retry-delay 3 "$RENDER_URL/api/video/openrouter/models")
          echo "$response" | jq -r '.data[] | [.id, (.supported_parameters // [] | join(","))] | @tsv'
          test "$(echo "$response" | jq '.data | length')" -gt 0

      - name: Start Render generation
        id: start
        env:
          RENDER_URL: https://pixelle-video-31d7.onrender.com
          PROMPT: ${{ inputs.prompt || 'AI Agents अब सिर्फ Chat नहीं करते — आपका Computer भी चला सकते हैं. Show a modern desktop AI agent controlling a computer, opening apps, browsing the web, writing code, and executing tasks, with a cinematic dark-tech visual style.' }}
        run: |
          set -e
          payload=$(python - <<'PY'
          import json, os
          print(json.dumps({
              "text": os.environ["PROMPT"],
              "mode": "generate",
              "n_scenes": 1,
              "title": "TechMind Central"
          }))
          PY
          )
          response=$(curl -fsS --retry 3 --retry-delay 5 \
            -X POST "$RENDER_URL/api/video/generate/async" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "$response"
          task_id=$(echo "$response" | jq -r '.task_id')
          test "$task_id" != "null" && test -n "$task_id"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Wait for video
        id: wait
        env:
          RENDER_URL: https://pixelle-video-31d7.onrender.com
          TASK_ID: ${{ steps.start.outputs.task_id }}
        run: |
          set -e
          for i in $(seq 1 90); do
            response=$(curl -fsS --retry 2 --retry-delay 3 "$RENDER_URL/api/tasks/$TASK_ID")
            status=$(echo "$response" | jq -r '.status')
            echo "Attempt $i: $status"
            if [ "$status" = "completed" ]; then
              video_url=$(echo "$response" | jq -r '.result.video_url')
              test "$video_url" != "null" && test -n "$video_url"
              echo "video_url=$video_url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failed" ] || [ "$status" = "cancelled" ]; then
              echo "$response"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for task $TASK_ID"
          exit 1

      - name: Download MP4
        env:
          VIDEO_URL: ${{ steps.wait.outputs.video_url }}
          FILENAME: ${{ inputs.filename }}
        run: |
          set -e
          curl -fL --retry 5 --retry-delay 5 "$VIDEO_URL" -o "$FILENAME"
          test -s "$FILENAME"
          file "$FILENAME"

      - name: Save MP4 as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: techmind-central-video
          path: ${{ inputs.filename }}
          if-no-files-found: error
          retention-days: 30
